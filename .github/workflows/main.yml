name: Compilar APK Optica Vision

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17 para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Instalar Flutter 3.27 (Soporte nativo Android SDK 35)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: 4. Crear proyecto y configurar SDK 35 + Reglas TFLite
        run: |
          flutter create --org com.opticavision --project-name optica_vision_ai /tmp/app_build
          mkdir -p /tmp/app_build/assets
          
          cp "pubspec.yaml"* /tmp/app_build/pubspec.yaml
          cp "main.dart"* /tmp/app_build/lib/main.dart
          cp "AndroidManifest.xml"* /tmp/app_build/android/app/src/main/AndroidManifest.xml
          cp "modelo_gafas"* /tmp/app_build/assets/modelo_gafas.tflite
          cp "labels"* /tmp/app_build/assets/labels.txt

          # Forzar compileSdk 35 en build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' /tmp/app_build/android/app/build.gradle* || true
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/g' /tmp/app_build/android/app/build.gradle* || true

          # Crear reglas ProGuard/R8 por seguridad para TensorFlow Lite
          cat << 'EOF' > /tmp/app_build/android/app/proguard-rules.pro
          -keep class org.tensorflow.lite.** { *; }
          -dontwarn org.tensorflow.lite.**
          -dontwarn org.tensorflow.lite.gpu.**
          EOF

      - name: 5. Descargar librerias y construir APK (Sin bloqueo R8)
        working-directory: /tmp/app_build
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --no-shrink

      - name: 6. Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Optica-Vision-AI
          path: /tmp/app_build/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
